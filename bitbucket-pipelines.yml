image: atlassian/default-image:3

pipelines:
  branches:
    release/automation-demo-v1:
      - step:
          name: Sync to GitHub
          clone:
            depth: full
          script:
            # Configure Git with GitHub identity...
            - git config --global user.email "shamil@mitetechnology.com"
            - git config --global user.name "shamil-mite"

            
            # We're already on the branch, just ensure we have full history..
            - git fetch --unshallow || true
            
            # Add GitHub as remote using token from repository variable
            - git remote add github https://${GITHUB_TOKEN}@github.com/shamil-mite/mite-marketing-agent-web-git.git || git remote set-url github https://${GITHUB_TOKEN}@github.com/shamil-mite/mite-marketing-agent-web-git.git
            
            # Amend the last commit to change the author to GitHub identity
            - git commit --amend --author="shamil-mite <shamil@mitetechnology.com>" --no-edit || true
            
            
            # Push to GitHub
            - git push github HEAD:release/automation-demo-v1 --force
            
            - echo "Successfully synced release/automation-demo-v1 to GitHub"
